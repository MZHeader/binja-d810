[project]
name = "binja-d810"
version = "0.1.0"
description = "d810-style MBA deobfuscation for Binary Ninja"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "z3-solver>=4.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"
